name: Release Beta

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: Successful CI push-to-dev run ID (no rebuild)
        required: true
        type: string

permissions: {}

concurrency:
  group: release-beta
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'awoaCrim/YesImBot-Beta' && github.ref == 'refs/heads/dev'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Publish unchanged artifacts from trusted CI
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ inputs.run_id }}
          REPOSITORY: ${{ github.repository }}
        run: python3 scripts/release.py publish --run-id "$RUN_ID" --repository "$REPOSITORY"
